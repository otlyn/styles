name: Commit messages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-message-policy:
    name: Commit message policy
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          LC_ALL: C.UTF-8
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [[ "$(git rev-parse HEAD^2)" != "$PR_HEAD" ]]; then
                echo "::error::Could not identify the pull request head in the merge commit."
                exit 1
              fi
              range=HEAD^1..HEAD^2
              ;;
            push)
              if [[ "$(git rev-parse HEAD)" != "$PUSH_AFTER" ]]; then
                echo "::error::Could not identify the pushed commit."
                exit 1
              fi
              if [[ "$PUSH_BEFORE" == 0000000000000000000000000000000000000000 ]]; then
                range=HEAD
              else
                # The previous tip can be absent from the checkout after a force-push.
                if ! git cat-file -e "$PUSH_BEFORE^{commit}" &&
                   ! git fetch --no-tags origin "$PUSH_BEFORE"; then
                  echo "::error::Could not retrieve the previous main tip: $PUSH_BEFORE."
                  exit 1
                fi
                range="$PUSH_BEFORE..HEAD"
              fi
              ;;
            *)
              echo "::error::Unexpected event: $GITHUB_EVENT_NAME."
              exit 1
              ;;
          esac

          matches=$(git log --format=%H --regexp-ignore-case --extended-regexp \
            --grep='^[[:blank:]]*co-authored-by[[:blank:]]*:' "$range")
          failed=0
          if [[ -n "$matches" ]]; then
            echo "::error::Remove Co-authored-by trailers from the following commits:"
            printf '%s\n' "$matches"
            failed=1
          fi

          commits=$(git rev-list "$range")
          if [[ -n "$commits" ]]; then
            while IFS= read -r commit; do
              # Keep trailing newlines through command substitution; remove only the message terminator.
              message=$(git show --no-notes --format=format:%B --no-patch "$commit" && printf '.')
              message=${message%.}
              message=${message%$'\n'}
              if [[ -z "$message" || "$message" == *$'\n'* || ${#message} -gt 72 ]]; then
                echo "::error::Commit $commit must have one non-empty line of at most 72 characters."
                failed=1
              fi
            done <<< "$commits"
          fi
          exit "$failed"
